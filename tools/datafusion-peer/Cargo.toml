# DataFusion peer -- a standalone measuring instrument for the benchmark
# harness, not a member of the columnar-engine workspace.
#
# The `[workspace]` table below is the load-bearing part of this file. Without
# it, cargo walks up the directory tree, finds the parent workspace root, and
# refuses to build this package because it is not listed in `members`. With it,
# this directory is its own workspace root and the published dependency graph of
# `columnar-engine` cannot move because a third incumbent was added to the
# comparison.

[package]
name = "datafusion-peer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runs a SQL query against a Parquet file with DataFusion and reports timing markers for the columnar-engine benchmark harness."
license = "MIT OR Apache-2.0"

# Empty on purpose: this package is the only member of its own workspace.
[workspace]

[dependencies]
# `default-features = false` keeps the comparison honest: DataFusion's default
# feature set pulls in encryption, compression and a pile of expression modules
# that the engine under test does not have. The two features that are enabled
# are the ones the benchmark actually needs -- Parquet I/O, and the Unicode
# string kernels.
datafusion = { version = "49", default-features = false, features = [
    "parquet",
    "unicode_expressions",
] }

# The runtime is ours so that the thread count the harness asks for is the
# thread count the engine actually gets.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Used directly for the Arrow result types and for the result table.
arrow = "55"

# The peer is its own workspace, so the root's `[workspace.lints]` do not
# reach it -- and nothing linted it at all, which is a hole in the gate: the
# peer is one of the three systems the published comparison quotes, so its
# code has to be held to the same standard as the engine's.
#
# The table below is the root's, copied rather than inherited: a separate
# workspace cannot inherit it.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
float_cmp = "warn"
indexing_slicing = "warn"
too_many_arguments = "warn"
must_use_candidate = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
