[package]
name = "columnar-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Benchmark harness and external comparison driver"
readme.workspace = true
# A benchmark harness for this repository's comparisons: it is not a library anybody depends on,
# and it must never be published by a workspace-wide publish.
publish = false
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
columnar-core = { workspace = true }
columnar-kernels = { workspace = true }
columnar-engine = { workspace = true }
columnar-testdata = { workspace = true }
criterion = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
divan = { version = "6.0.0", package = "codspeed-divan-compat" }

# CodSpeed benchmarks (divan, through the `codspeed-divan-compat` layer).
# Run them with `cargo codspeed build -p columnar-bench && cargo codspeed run`.
[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "engine"
harness = false
