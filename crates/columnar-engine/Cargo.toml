[package]
name = "columnar-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Vectorized operators, Parquet ingestion and the query pipeline"
# The crate's own README, not the repository's.
readme = "README.md"
keywords = ["columnar", "query-engine", "parquet", "embedded-analytics"]
categories = ["database-implementations", "algorithms", "data-structures"]
# The fifteen measurement probes are this project's evidence harness, not an
# embedder's examples, so the package does not carry them. The package carries
# no dataset, no benchmark report and no instrument.
exclude = ["examples/**"]

[lints]
workspace = true

[dependencies]
columnar-core = { workspace = true }
columnar-kernels = { workspace = true }
parquet = { workspace = true }
arrow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
