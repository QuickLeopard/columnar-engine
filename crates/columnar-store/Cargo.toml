[package]
name = "columnar-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "An append-only store for the columnar engine: a writer, a manifest, and a commit"
# The crate's own README, not the repository's. A reader on crates.io opens
# the crate's front page, and the portfolio's front page is not the crate's.
readme = "README.md"
keywords = ["columnar", "storage", "parquet", "embedded-analytics"]
categories = ["database-implementations", "data-structures"]
# The crate is published with the others.
#
# It was held back while its API was still moving: the engine had to learn to
# read a table that is many files, and the store's own surface was going to
# follow that. **Spec 040 settled both** -- the engine has `FileSetSource`, and
# the store's `Table::paths` is the list of paths it takes -- so the reason is
# spent and the crate is publishable.
#
# **The publish itself is a separate act**, and it is the user's: it needs a
# crates.io account and a token. The order is computed from the manifests by
# `scripts/check-package.sh` -- from the **`[dependencies]`** only, because a
# dev-dependency is dropped from the published manifest -- and the store's
# library depends on `columnar-core` and on nothing else in the workspace, so
# it lands after the core and before the engine.
publish = true
# The store's probe is this project's evidence harness, not an embedder's
# example, so the package does not carry it.
exclude = ["examples/**"]

[lints]
workspace = true

[dependencies]
# The store is *below* the engine: it writes the files the engine reads, and
# its **library** does not depend on the engine. So the engine's read path
# cannot move because of anything here. (The **test** does depend on it --
# the engine, to read what the store wrote -- and that edge is a dev-edge
# only; see the dev-dependencies below.)
#
# Its **library** depends on `columnar-core` -- the vocabulary -- and on
# nothing else in this workspace. The core is published first, so the store
# is published after it and before the engine.
# The vocabulary. The store's **rows** are the engine's own vocabulary -- a
# column chunk with an encoding and a validity mask -- and the conversion to
# Arrow's lives here, in the store. It cannot live in the core (a vocabulary
# that depends on a framework is not a vocabulary) and must not live in the
# engine (the engine's surface would carry Arrow).
#
# The edge is to the **core**, not to the engine: the engine is still below
# the store in the dependency direction, and the publish order (core, kernels,
# store, engine) is unchanged by it.
columnar-core = { workspace = true }
parquet = { workspace = true }
arrow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The generator, for the test that says the store writes the file the
# generator wrote. It is a benchmark fixture and is never published.
#
# The dependency is **path-only**, and that is not a style choice: a
# path-only dependency is **dropped** from the published manifest, and a
# dependency with a version is not. `columnar-testdata` is not on crates.io,
# so a versioned dev-dependency on it makes `cargo package` fail with
# "no matching package named `columnar-testdata` found" -- and the crate
# could not be published at all.
columnar-testdata = { path = "../../crates/columnar-testdata" }

# The engine, for the test that says the store's table is read by the engine
# as one table: the store writes the files, the engine reads the set, and the
# composition is the claim the store's half rests on.
#
# The dependency is **path-only**, for the same reason the generator's is: a
# path-only dependency is **dropped** from the published manifest, and a
# dependency with a version is not. A versioned dev-dependency on the engine
# would make `cargo package -p columnar-store` wait for the engine to be on
# crates.io -- the engine is published with the others, and the publish is a
# separate act, so the crate must not wait on it to be packaged.
#
# **The edge is test-only.** The engine never depends on the store, in any
# section and for any reason: the glue is a list of paths.
columnar-engine = { path = "../columnar-engine" }
