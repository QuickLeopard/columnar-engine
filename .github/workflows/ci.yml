# Continuous integration for the columnar engine.
#
# Three things are checked on every push, and they are all non-negotiable:
#
#   1. the workspace is formatted,
#   2. the workspace is lint-clean under clippy `all` + `pedantic`,
#   3. every test passes -- including the differential suite, which is the
#      mechanism that keeps the five kernel implementations honest.
#
# The benchmark is NOT run here. A shared runner is a noisy machine, and a
# performance number measured on one is not a number this repository is
# willing to publish. The benchmark lives in `bench.yml` (macOS / NEON) and
# `bench-avx2.yml` (self-hosted x86-64 / AVX2), both `workflow_dispatch`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The rustfmt and clippy versions must match the ones the project was
  # formatted and linted with. Pinned so that a toolchain bump shows up as a
  # diff to review rather than as a surprise failure.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both architectures are linted, not just one. The kernel has
        # architecture-specific code (NEON and AVX2 paths, plus the Rust
        # intrinsics), and a lint that only ever sees x86-64 would not notice
        # that the AArch64 path rotted.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: cargo test
        run: cargo test --workspace --all-targets

  differential:
    name: differential kernel agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # Named separately from the general test job because it is the gate
      # that protects the project's headline claim: every implementation of
      # the comparison predicate must agree with the oracle, bit for bit.
      - name: Run the differential suite
        run: cargo test -p columnar-kernels --test differential -- --nocapture

  cross-check:
    name: cross-compile check (x86-64 from ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin
      # This job exists because of a specific failure. The kernel has an
      # x86-64 half -- the AVX2 path, in C++ and in Rust intrinsics -- and
      # the development machine is an ARM64 MacBook. That half was never
      # compiled by anyone, and it sat in the tree with two type errors in
      # it, for as long as the project existed.
      #
      # The `ubuntu-latest` jobs above do compile it, because they are
      # x86-64. But they only run if CI is wired to a remote, and until
      # then the local gate is this one. `just check-x86` does the same
      # thing on the author's machine.
      - name: cargo check for x86_64
        run: cargo check --workspace --all-targets --target x86_64-apple-darwin

  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  no-generated-data:
    name: no generated data is committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A dataset is a function of (scale_factor, seed) and is regenerated by
      # `just dataset`. Committing one would put a large binary in the
      # history for no benefit.
      - name: Fail if a dataset was committed
        run: |
          if find . -name '*.parquet' -not -path './target/*' | grep -q .; then
            echo "A Parquet dataset is committed. Run 'just clean-data' and remove it."
            find . -name '*.parquet' -not -path './target/*'
            exit 1
          fi
          echo "no committed datasets"
